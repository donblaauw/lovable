<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lovable Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f1a;
      color: #e2e2e2;
      min-height: 100vh;
      padding: 2rem;
    }
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    header h1 {
      font-size: 2.5rem;
      color: #a78bfa;
    }
    header p {
      color: #9ca3af;
      margin-top: 0.5rem;
    }
    section {
      max-width: 960px;
      margin: 0 auto 2.5rem;
    }
    section h2 {
      font-size: 1.1rem;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }
    .game-card {
      background: #1e1e2e;
      border: 1px solid #2e2e4e;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      transition: border-color 0.2s, transform 0.2s;
    }
    .game-card:hover {
      border-color: #a78bfa;
      transform: translateY(-3px);
    }
    .game-card h3 {
      font-size: 1.1rem;
      margin-bottom: 0.4rem;
      text-transform: capitalize;
    }
    .game-card .last-played {
      font-size: 0.78rem;
      color: #6b7280;
      margin-bottom: 1rem;
    }
    .game-card a {
      display: inline-block;
      padding: 0.5rem 1.25rem;
      background: #a78bfa;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    .game-card a:hover { background: #7c3aed; }
    #recent-section { display: none; }
    #empty {
      text-align: center;
      color: #6b7280;
      font-size: 1.1rem;
      margin-top: 4rem;
    }
    #empty code {
      background: #1e1e2e;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      color: #a78bfa;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎮 Lovable Games</h1>
    <p>All games served locally — no CORS issues</p>
  </header>

  <section id="recent-section">
    <h2>Recently Played</h2>
    <div class="games-grid" id="recent-grid"></div>
  </section>

  <section id="all-section">
    <h2>All Games</h2>
    <div class="games-grid" id="games-grid"></div>
  </section>

  <p id="empty" hidden>
    No games found. Add a game folder inside <code>games/</code> and refresh.
  </p>

  <script>
    const STORAGE_KEY = 'lovable_sessions';
    const MAX_RECENT = 5;

    function getSessions() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function recordSession(name) {
      const sessions = getSessions().filter((s) => s.name !== name);
      sessions.unshift({ name, ts: Date.now() });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions.slice(0, MAX_RECENT)));
    }

    function timeAgo(ts) {
      const diff = Date.now() - ts;
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    function makeCard(name, url, ts) {
      const card = document.createElement('div');
      card.className = 'game-card';
      const label = name.replace(/-/g, ' ');
      const meta = ts ? `<p class="last-played">Played ${timeAgo(ts)}</p>` : '<p class="last-played">&nbsp;</p>';
      card.innerHTML = `<h3>${label}</h3>${meta}<a href="${url}" target="_blank" data-game="${name}">Play</a>`;
      card.querySelector('a').addEventListener('click', () => recordSession(name));
      return card;
    }

    fetch('/api/games')
      .then((r) => r.json())
      .then((games) => {
        const grid = document.getElementById('games-grid');
        const empty = document.getElementById('empty');

        if (games.length === 0) {
          document.getElementById('all-section').hidden = true;
          empty.hidden = false;
          return;
        }

        const urlMap = Object.fromEntries(games.map(({ name, url }) => [name, url]));

        // Recently played
        const sessions = getSessions().filter((s) => urlMap[s.name]);
        if (sessions.length > 0) {
          document.getElementById('recent-section').style.display = 'block';
          const recentGrid = document.getElementById('recent-grid');
          sessions.forEach(({ name, ts }) => recentGrid.appendChild(makeCard(name, urlMap[name], ts)));
        }

        // All games
        games.forEach(({ name, url }) => grid.appendChild(makeCard(name, url, null)));
      });
  </script>
</body>
</html>
